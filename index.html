<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB Student</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>WEB Students</h1>
        <nav>
            <ul>
                <li>Inicio</li>
                <li>Formulario</li>
            </ul>
        </nav>
    </header>

    <main>

        <section>
            <h2>Lista de estudiantes</h2>
            <label for="search-email">Buscar</label>
            <input type="search" name="search" id="search-email">

            <label for="ageMin">Edad</label>
            <input type="number" name="age" id="ageMin">

            <label for="courseSelect">Curso</label>
            <select name="course" id="courseSelect">
                <option value="">Todos</option>
                <option value="Desarrollo con AI 2026">Desarrollo con AI 2026</option>
                <option value="Frontend con AI 2026">Frontend con AI 2026</option>
                <option value="Programacion con AI 2026">Programacion con AI 2026</option>
            </select>

            <button id="clear-search">Borrar busqueda</button>

            <div id="cards">
            </div>

        </section>

        <section>
            <h2>Rellenar Formulario</h2>
            <form action="" id="form">
                <label for="name">Tu Nombre</label>
                <input type="text" name="name" id="name" required>

                <label for="age">Tu Edad</label>
                <input type="number" name="age" id="age" required>

                <label for="email">Tu Email</label>
                <input type="email" name="email" id="email" required>

                <label for="course">Tu Curso</label>
                <input type="text" name="course" id="course" required>
                <button type="submit">Enviar</button>
            </form>
        </section>

    </main>




    <script type="module" src="js/script.js"></script>
</body>

</html>
